name: REQ-171C-6 untrusted CLI argv

on:
  pull_request:
    paths:
      - "src/swarm/core/cli_adapter.py"
      - "src/swarm/core/cli_sessions.py"
      - "src/swarm/core/session_policy.py"
      - "src/swarm/core/cli_catalog.py"
      - "tests/core/test_cli_untrusted_argv.py"
      - "tests/core/test_cli_adapter.py"
      - "tests/core/test_cli_sessions.py"
      - "tests/core/test_session_policy.py"
      - "tests/core/test_cli_catalog.py"
      - ".github/workflows/req171c6-untrusted-argv.yml"
  push:
    branches: [main]
    paths:
      - "src/swarm/core/cli_adapter.py"
      - "src/swarm/core/cli_sessions.py"
      - "src/swarm/core/session_policy.py"
      - "src/swarm/core/cli_catalog.py"
      - "tests/core/test_cli_untrusted_argv.py"
      - "tests/core/test_cli_adapter.py"
      - "tests/core/test_cli_sessions.py"
      - "tests/core/test_session_policy.py"
      - "tests/core/test_cli_catalog.py"
      - ".github/workflows/req171c6-untrusted-argv.yml"

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest C-H8 untrusted argv
        run: |
          uv run pytest \
            tests/core/test_cli_untrusted_argv.py \
            tests/core/test_cli_sessions.py \
            tests/core/test_session_policy.py \
            tests/core/test_cli_catalog.py \
            tests/core/test_cli_adapter.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
