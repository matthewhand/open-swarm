name: REQ-154 Support/CoS lifecycle

on:
  pull_request:
    paths:
      - "src/swarm/core/agent_lifecycle.py"
      - "src/swarm/core/agent_roles.py"
      - "src/swarm/core/agent_mailbox.py"
      - "src/swarm/core/blueprint_base.py"
      - "src/swarm/core/remotes.py"
      - "src/swarm/consumers.py"
      - "src/swarm/views/chat_views.py"
      - "src/swarm/blueprints/support/blueprint_support.py"
      - "src/swarm/management/commands/purge_archived_agents.py"
      - "skills/support-session-ownership/SKILL.md"
      - "tests/core/test_agent_lifecycle.py"
      - "tests/unit/test_req154_lifecycle.py"
      - "docs/AGENT_LIFECYCLE.md"
      - "docs/adr/009-peer-mailbox.md"
      - ".github/workflows/req154-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "src/swarm/core/agent_lifecycle.py"
      - "src/swarm/core/agent_roles.py"
      - "src/swarm/core/agent_mailbox.py"
      - "src/swarm/core/blueprint_base.py"
      - "src/swarm/core/remotes.py"
      - "src/swarm/consumers.py"
      - "src/swarm/views/chat_views.py"
      - "src/swarm/blueprints/support/blueprint_support.py"
      - "src/swarm/management/commands/purge_archived_agents.py"
      - "skills/support-session-ownership/SKILL.md"
      - "tests/core/test_agent_lifecycle.py"
      - "tests/unit/test_req154_lifecycle.py"
      - "docs/AGENT_LIFECYCLE.md"
      - "docs/adr/009-peer-mailbox.md"
      - ".github/workflows/req154-lifecycle.yml"

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: REQ-154 pytest (own-diff)
        run: |
          uv run pytest \
            tests/core/test_agent_lifecycle.py \
            tests/core/test_agent_roles.py \
            tests/unit/test_req154_lifecycle.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
