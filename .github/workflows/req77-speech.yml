name: REQ-77 speech STT/TTS

on:
  pull_request:
    paths:
      - "src/swarm/core/speech.py"
      - "src/swarm/views/speech_api.py"
      - "src/swarm/urls.py"
      - "src/swarm/core/config_ownership.py"
      - "tests/core/test_speech.py"
      - "tests/views/test_speech_api.py"
      - "webui/frontend/src/lib/speechSettings.ts"
      - "webui/frontend/src/lib/speechRuntime.ts"
      - "webui/frontend/src/lib/api.ts"
      - "webui/frontend/src/lib/__tests__/speechSettings.test.ts"
      - "webui/frontend/src/lib/__tests__/speechRuntime.test.ts"
      - "webui/frontend/src/components/SpeechSettings.tsx"
      - "webui/frontend/src/components/ReadAloudButton.tsx"
      - "webui/frontend/src/components/SettingsSheet.tsx"
      - "webui/frontend/src/components/SearchPalette.tsx"
      - "webui/frontend/src/components/__tests__/SpeechSettings.test.tsx"
      - "webui/frontend/src/components/__tests__/ReadAloudButton.test.tsx"
      - "webui/frontend/src/pages/ChatPage.tsx"
      - "webui/frontend/src/pages/__tests__/ChatPage.test.tsx"
      - ".github/workflows/req77-speech.yml"
  push:
    branches: [main]
    paths:
      - "src/swarm/core/speech.py"
      - "src/swarm/views/speech_api.py"
      - "src/swarm/urls.py"
      - "src/swarm/core/config_ownership.py"
      - "tests/core/test_speech.py"
      - "tests/views/test_speech_api.py"
      - "webui/frontend/src/lib/speechSettings.ts"
      - "webui/frontend/src/lib/speechRuntime.ts"
      - "webui/frontend/src/lib/api.ts"
      - "webui/frontend/src/lib/__tests__/speechSettings.test.ts"
      - "webui/frontend/src/lib/__tests__/speechRuntime.test.ts"
      - "webui/frontend/src/components/SpeechSettings.tsx"
      - "webui/frontend/src/components/ReadAloudButton.tsx"
      - "webui/frontend/src/components/SettingsSheet.tsx"
      - "webui/frontend/src/components/SearchPalette.tsx"
      - "webui/frontend/src/components/__tests__/SpeechSettings.test.tsx"
      - "webui/frontend/src/components/__tests__/ReadAloudButton.test.tsx"
      - "webui/frontend/src/pages/ChatPage.tsx"
      - "webui/frontend/src/pages/__tests__/ChatPage.test.tsx"
      - ".github/workflows/req77-speech.yml"

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest speech suite
        run: |
          uv run pytest \
            tests/core/test_speech.py \
            tests/views/test_speech_api.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest speech suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/speechSettings.test.ts \
            src/lib/__tests__/speechRuntime.test.ts \
            src/components/__tests__/SpeechSettings.test.tsx \
            src/components/__tests__/ReadAloudButton.test.tsx
          npx vitest run src/pages/__tests__/ChatPage.test.tsx \
            -t "voice input"
          npx vitest run src/components/__tests__/SearchPalette.test.tsx \
            -t "Speech settings"
