name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Build ADR-001 SPA (make frontend)
        run: ./scripts/build_frontend.sh

      - name: Confirm dist/index.html
        run: test -f webui/frontend/dist/index.html

      - name: Install Playwright Chromium
        working-directory: webui/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright chat-send mock inference (REQ-13)
        working-directory: webui/frontend
        run: npx playwright test e2e/chat-send.spec.ts
        env:
          CI: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (used by MCP-server test fixtures)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
