name: REQ-75 blueprint roles

on:
  pull_request:
    paths:
      - "src/swarm/core/agent_roles.py"
      - "src/swarm/core/definition_explain.py"
      - "src/swarm/views/api_views.py"
      - "src/swarm/blueprints/software_dev/blueprint_software_dev.py"
      - "src/swarm/blueprints/sdlc_handoff/blueprint_sdlc_handoff.py"
      - "src/swarm/static/css/rest_mode_style.css"
      - "webui/frontend/src/lib/agentRoles.ts"
      - "webui/frontend/src/lib/agentEdits.ts"
      - "webui/frontend/src/lib/api.ts"
      - "webui/frontend/src/lib/definitionExplain.ts"
      - "webui/frontend/src/components/AgentEditor.tsx"
      - "webui/frontend/src/components/SettingsSheet.tsx"
      - "webui/frontend/src/index.css"
      - "tests/core/test_req75_blueprint_roles.py"
      - "tests/core/test_agent_roles.py"
      - "tests/core/test_team_rosters.py"
      - "tests/views/test_api_views.py"
      - "tests/unit/test_req67_role_badge_chrome.py"
      - "webui/frontend/src/lib/__tests__/agentRoles.test.ts"
      - "webui/frontend/src/lib/__tests__/agentEdits.test.ts"
      - "webui/frontend/src/components/__tests__/AgentEditor.test.tsx"
      - "webui/frontend/src/components/__tests__/SettingsSheet.test.tsx"
      - ".github/workflows/req75-blueprint-roles.yml"
  push:
    branches: [main]
    paths:
      - "src/swarm/core/agent_roles.py"
      - "src/swarm/core/definition_explain.py"
      - "src/swarm/views/api_views.py"
      - "src/swarm/blueprints/software_dev/blueprint_software_dev.py"
      - "src/swarm/blueprints/sdlc_handoff/blueprint_sdlc_handoff.py"
      - "src/swarm/static/css/rest_mode_style.css"
      - "webui/frontend/src/lib/agentRoles.ts"
      - "webui/frontend/src/lib/agentEdits.ts"
      - "webui/frontend/src/lib/api.ts"
      - "webui/frontend/src/lib/definitionExplain.ts"
      - "webui/frontend/src/components/AgentEditor.tsx"
      - "webui/frontend/src/components/SettingsSheet.tsx"
      - "webui/frontend/src/index.css"
      - "tests/core/test_req75_blueprint_roles.py"
      - "tests/core/test_agent_roles.py"
      - "tests/core/test_team_rosters.py"
      - "tests/views/test_api_views.py"
      - "tests/unit/test_req67_role_badge_chrome.py"
      - "webui/frontend/src/lib/__tests__/agentRoles.test.ts"
      - "webui/frontend/src/lib/__tests__/agentEdits.test.ts"
      - "webui/frontend/src/components/__tests__/AgentEditor.test.tsx"
      - "webui/frontend/src/components/__tests__/SettingsSheet.test.tsx"
      - ".github/workflows/req75-blueprint-roles.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: REQ-75 pytest
        run: |
          uv run pytest \
            tests/core/test_req75_blueprint_roles.py \
            tests/core/test_agent_roles.py \
            tests/core/test_team_rosters.py \
            tests/views/test_api_views.py \
            tests/unit/test_req67_role_badge_chrome.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest REQ-75 suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/agentRoles.test.ts \
            src/lib/__tests__/agentEdits.test.ts \
            src/components/__tests__/AgentEditor.test.tsx \
            src/components/__tests__/SettingsSheet.test.tsx
