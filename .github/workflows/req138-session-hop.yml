name: REQ-138 session hop

on:
  pull_request:
    paths:
      - "src/swarm/core/cli_session_hop.py"
      - "src/swarm/core/cli_catalog.py"
      - "src/swarm/core/chat_store.py"
      - "src/swarm/views/cli_session_hop_api.py"
      - "src/swarm/urls.py"
      - "src/swarm/blueprints/cli_agent/blueprint_cli_agent.py"
      - "src/swarm/blueprints/common/cli_fusion_support.py"
      - "src/swarm/consumers.py"
      - "tests/core/test_cli_session_hop.py"
      - "tests/core/test_cli_catalog.py"
      - "tests/views/test_cli_session_hop_api.py"
      - "tests/unit/test_req138_session_hop.py"
      - "tests/blueprints/test_cli_agent.py"
      - "webui/frontend/src/lib/cliSessionHop.ts"
      - "webui/frontend/src/lib/sessionHopPrefs.ts"
      - "webui/frontend/src/lib/__tests__/cliSessionHop.test.ts"
      - "webui/frontend/src/components/CliSessionPicker.tsx"
      - "webui/frontend/src/components/__tests__/CliSessionPicker.test.tsx"
      - "webui/frontend/src/pages/ChatPage.tsx"
      - "webui/frontend/src/pages/__tests__/ChatPage.test.tsx"
      - "webui/frontend/e2e/dropdown-status.spec.ts"
      - "docs/CLI_FUSION.md"
      - ".github/workflows/req138-session-hop.yml"
  push:
    branches: [main]
    paths:
      - "src/swarm/core/cli_session_hop.py"
      - "src/swarm/core/cli_catalog.py"
      - "src/swarm/core/chat_store.py"
      - "src/swarm/views/cli_session_hop_api.py"
      - "src/swarm/urls.py"
      - "src/swarm/blueprints/cli_agent/blueprint_cli_agent.py"
      - "src/swarm/blueprints/common/cli_fusion_support.py"
      - "src/swarm/consumers.py"
      - "tests/core/test_cli_session_hop.py"
      - "tests/core/test_cli_catalog.py"
      - "tests/views/test_cli_session_hop_api.py"
      - "tests/unit/test_req138_session_hop.py"
      - "tests/blueprints/test_cli_agent.py"
      - "webui/frontend/src/lib/cliSessionHop.ts"
      - "webui/frontend/src/lib/sessionHopPrefs.ts"
      - "webui/frontend/src/lib/__tests__/cliSessionHop.test.ts"
      - "webui/frontend/src/components/CliSessionPicker.tsx"
      - "webui/frontend/src/components/__tests__/CliSessionPicker.test.tsx"
      - "webui/frontend/src/pages/ChatPage.tsx"
      - "webui/frontend/src/pages/__tests__/ChatPage.test.tsx"
      - "webui/frontend/e2e/dropdown-status.spec.ts"
      - "docs/CLI_FUSION.md"
      - ".github/workflows/req138-session-hop.yml"

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest hop suite
        run: |
          uv run pytest \
            tests/core/test_cli_session_hop.py \
            tests/views/test_cli_session_hop_api.py \
            tests/unit/test_req138_session_hop.py \
            tests/core/test_cli_catalog.py \
            tests/blueprints/test_cli_agent.py -k hop
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest hop suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/cliSessionHop.test.ts \
            src/components/__tests__/CliSessionPicker.test.tsx
          npx vitest run src/pages/__tests__/ChatPage.test.tsx -t "REQ-46"
