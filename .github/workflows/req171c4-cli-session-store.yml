name: REQ-171C-4 one CLI session store

on:
  pull_request:
    paths:
      - "src/swarm/core/cli_adapter.py"
      - "src/swarm/core/cli_catalog.py"
      - "src/swarm/core/cli_sessions.py"
      - "src/swarm/core/session_policy.py"
      - "src/swarm/blueprints/cli_agent/blueprint_cli_agent.py"
      - "src/swarm/views/chat_persist_views.py"
      - "src/swarm/consumers.py"
      - "tests/core/test_cli_resume_argv.py"
      - "tests/core/test_session_policy.py"
      - "tests/core/test_cli_catalog.py"
      - "tests/core/test_cli_untrusted_argv.py"
      - "tests/views/test_chat_thread_on_mode.py"
      - "tests/test_consumers_on_mode.py"
      - ".github/workflows/req171c4-cli-session-store.yml"
  push:
    branches: [main]
    paths:
      - "src/swarm/core/cli_adapter.py"
      - "src/swarm/core/cli_catalog.py"
      - "src/swarm/core/cli_sessions.py"
      - "src/swarm/core/session_policy.py"
      - "src/swarm/blueprints/cli_agent/blueprint_cli_agent.py"
      - "src/swarm/views/chat_persist_views.py"
      - "src/swarm/consumers.py"
      - "tests/core/test_cli_resume_argv.py"
      - "tests/core/test_session_policy.py"
      - "tests/core/test_cli_catalog.py"
      - "tests/core/test_cli_untrusted_argv.py"
      - "tests/views/test_chat_thread_on_mode.py"
      - "tests/test_consumers_on_mode.py"
      - ".github/workflows/req171c4-cli-session-store.yml"

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest C-H7 one CLI session store
        run: |
          uv run pytest \
            tests/core/test_cli_resume_argv.py \
            tests/core/test_session_policy.py \
            tests/core/test_cli_catalog.py \
            tests/core/test_cli_untrusted_argv.py \
            tests/views/test_chat_thread_on_mode.py \
            tests/test_consumers_on_mode.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"
