name: REQ-88 provider rate limits

on:
  pull_request:
    paths:
      - "src/swarm/core/provider_rate_limit.py"
      - "src/swarm/core/config_ownership.py"
      - "src/swarm/core/transcript_roles.py"
      - "src/swarm/consumers.py"
      - "src/swarm/views/rate_limits_api.py"
      - "src/swarm/views/chat_views.py"
      - "src/swarm/urls.py"
      - "tests/core/test_provider_rate_limit.py"
      - "tests/core/test_req88_consumer_queue.py"
      - "tests/core/test_config_ownership.py"
      - "tests/views/test_rate_limits_api.py"
      - "webui/frontend/src/lib/providerRateLimits.ts"
      - "webui/frontend/src/lib/api.ts"
      - "webui/frontend/src/lib/chatWs.ts"
      - "webui/frontend/src/lib/transcriptReconstruct.ts"
      - "webui/frontend/src/lib/__tests__/providerRateLimits.test.ts"
      - "webui/frontend/src/lib/__tests__/chatWs.test.ts"
      - "webui/frontend/src/components/ProviderRateLimitFields.tsx"
      - "webui/frontend/src/components/RateLimitStatusLine.tsx"
      - "webui/frontend/src/components/CliAgentsSettingsPane.tsx"
      - "webui/frontend/src/components/SettingsSheet.tsx"
      - "webui/frontend/src/components/__tests__/ProviderRateLimitFields.test.tsx"
      - "webui/frontend/src/components/__tests__/RateLimitStatusLine.test.tsx"
      - "webui/frontend/src/components/__tests__/SettingsSheet.test.tsx"
      - "webui/frontend/src/pages/ChatPage.tsx"
      - "webui/frontend/src/App.tsx"
      - "webui/frontend/src/index.css"
      - ".github/workflows/req88-provider-rate-limits.yml"
  push:
    branches: [main]
    paths:
      - "src/swarm/core/provider_rate_limit.py"
      - "src/swarm/core/config_ownership.py"
      - "src/swarm/core/transcript_roles.py"
      - "src/swarm/consumers.py"
      - "src/swarm/views/rate_limits_api.py"
      - "src/swarm/views/chat_views.py"
      - "src/swarm/urls.py"
      - "tests/core/test_provider_rate_limit.py"
      - "tests/core/test_req88_consumer_queue.py"
      - "tests/core/test_config_ownership.py"
      - "tests/views/test_rate_limits_api.py"
      - "webui/frontend/src/lib/providerRateLimits.ts"
      - "webui/frontend/src/lib/api.ts"
      - "webui/frontend/src/lib/chatWs.ts"
      - "webui/frontend/src/lib/transcriptReconstruct.ts"
      - "webui/frontend/src/lib/__tests__/providerRateLimits.test.ts"
      - "webui/frontend/src/lib/__tests__/chatWs.test.ts"
      - "webui/frontend/src/components/ProviderRateLimitFields.tsx"
      - "webui/frontend/src/components/RateLimitStatusLine.tsx"
      - "webui/frontend/src/components/CliAgentsSettingsPane.tsx"
      - "webui/frontend/src/components/SettingsSheet.tsx"
      - "webui/frontend/src/components/__tests__/ProviderRateLimitFields.test.tsx"
      - "webui/frontend/src/components/__tests__/RateLimitStatusLine.test.tsx"
      - "webui/frontend/src/components/__tests__/SettingsSheet.test.tsx"
      - "webui/frontend/src/pages/ChatPage.tsx"
      - "webui/frontend/src/App.tsx"
      - "webui/frontend/src/index.css"
      - ".github/workflows/req88-provider-rate-limits.yml"

jobs:
  own-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --all-extras

      - name: Pytest REQ-88 suite
        run: |
          uv run pytest \
            tests/core/test_provider_rate_limit.py \
            tests/core/test_req88_consumer_queue.py \
            tests/core/test_config_ownership.py \
            tests/views/test_rate_limits_api.py
        env:
          DJANGO_ALLOW_ASYNC_UNSAFE: "true"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: webui/frontend
        run: npm ci

      - name: Vitest REQ-88 suite
        working-directory: webui/frontend
        run: |
          npx vitest run \
            src/lib/__tests__/providerRateLimits.test.ts \
            src/lib/__tests__/chatWs.test.ts \
            src/components/__tests__/ProviderRateLimitFields.test.tsx \
            src/components/__tests__/RateLimitStatusLine.test.tsx
          npx vitest run src/components/__tests__/SettingsSheet.test.tsx \
            -t "lists configured profiles"
