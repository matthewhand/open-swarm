<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-os-theme="dark">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Open Swarm{% endblock %}</title>
    <link href="{% static 'contrib/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/rest_mode_style.css' %}" rel="stylesheet">
    <link href="{% static 'css/dropdown.css' %}" rel="stylesheet">
    <link href="{% static 'css/operator.css' %}" rel="stylesheet">
    <script src="{% static 'contrib/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/htmx.min.js' %}"></script>
    {# External: avoid HTMX <style> inject under style-src 'self' (see htmx_csp.js). #}
    <script src="{% static 'js/htmx_csp.js' %}"></script>
    <link rel="stylesheet" href="{% static 'contrib/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'contrib/prism/prism-tomorrow.min.css' %}">
    <script defer src="{% static 'contrib/prism/prism.min.js' %}"></script>
    <script defer src="{% static 'contrib/prism/prism-python.min.js' %}"></script>
    <script src="{% static 'js/chrome_theme.js' %}"></script>
</head>
<body class="os-app">
    <a class="visually-hidden-focusable btn btn-sm btn-primary position-absolute top-0 start-0 m-2 z-3" href="#os-main">Skip to main content</a>
    {% with path=request.path %}
    <header class="os-header sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark os-navbar py-1" aria-label="Primary">
            <div class="os-navbar-inner">
                <button type="button" class="os-sidebar-toggle d-lg-none" id="os-sidebar-open" aria-label="Open agents sidebar">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <a class="navbar-brand fw-semibold" href="/">Open Swarm</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    {# Primary IA matches SPA Home: Home · Chat · Blueprints · Teams · Sessions · Settings #}
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link {% if path == '/' %}active{% endif %}"
                               href="/" {% if path == '/' %}aria-current="page"{% endif %}>Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if path == '/chat' or path|slice:':6' == '/chat/' %}active{% endif %}"
                               href="/chat" {% if path == '/chat' or path|slice:':6' == '/chat/' %}aria-current="page"{% endif %}>Chat</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/blueprint' in path or '/agent-creator' in path or '/team-creator' in path %}active{% endif %}"
                               href="/blueprint-library/"
                               {% if '/blueprint' in path or '/agent-creator' in path or '/team-creator' in path %}aria-current="page"{% endif %}>Blueprints</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if path|slice:':7' == '/teams/' %}active{% endif %}"
                               href="/teams/launch/"
                               {% if path|slice:':7' == '/teams/' %}aria-current="page"{% endif %}>Teams</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if path|slice:':10' == '/sessions/' %}active{% endif %}"
                               href="/sessions/"
                               {% if path|slice:':10' == '/sessions/' %}aria-current="page"{% endif %}>Sessions</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if path|slice:':10' == '/settings/' or path|slice:':10' == '/profiles/' %}active{% endif %}"
                               href="/settings/"
                               {% if path|slice:':10' == '/settings/' or path|slice:':10' == '/profiles/' %}aria-current="page"{% endif %}>Settings</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ms-lg-auto align-items-lg-center">
                        <li class="nav-item">
                            <button type="button" class="os-theme-toggle nav-link" id="os-theme-toggle"
                                    aria-label="Switch to light theme">Light</button>
                        </li>
                        <li class="nav-item dropdown d-none d-lg-block">
                            <a class="nav-link dropdown-toggle opacity-75" href="#" id="moreNavDropdown"
                               role="button" data-bs-toggle="dropdown" aria-expanded="false">More</a>
                            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end" aria-labelledby="moreNavDropdown">
                                <li>
                                    <a class="dropdown-item" href="https://github.com/matthewhand/open-swarm"
                                       target="_blank" rel="noopener noreferrer">GitHub</a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div id="os-agent-pin-grid" class="os-agent-pin-grid is-empty" aria-label="Pinned agents"></div>
    </header>
    {% endwith %}

    <div class="os-shell">
        <button type="button" class="os-sidebar-backdrop" id="os-sidebar-backdrop" hidden aria-label="Close agents sidebar"></button>
        <aside class="os-agent-sidebar" id="os-agent-sidebar" aria-label="Agents">
            <div class="os-agent-sidebar__head">
                <p class="os-agent-sidebar__kicker">Agents</p>
                <button type="button" class="os-sidebar-close d-lg-none" id="os-sidebar-close" aria-label="Close agents sidebar">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div class="os-agent-sidebar__search">
                <label class="visually-hidden" for="os-agent-filter">Filter agents</label>
                <input id="os-agent-filter" type="search" class="os-agent-filter" placeholder="Search agents" autocomplete="off">
            </div>
            <nav class="os-agent-sidebar__list" aria-label="Agent list">
                <p class="os-agent-status" id="os-agent-status">Loading agents…</p>
                <ul class="os-agent-ul" id="os-agent-list"></ul>
                <div class="os-agent-hidden" id="os-agent-hidden-wrap" hidden>
                    <button type="button" class="os-agent-hidden__toggle" id="os-agent-hidden-toggle" aria-expanded="false">
                        Hidden <span id="os-agent-hidden-count">(0)</span>
                    </button>
                    <ul class="os-agent-ul" id="os-agent-hidden-list" hidden></ul>
                </div>
            </nav>
            <div class="os-agent-sidebar__foot">
                <a href="/teams/"><i class="fas fa-users" aria-hidden="true"></i> Teams</a>
                <a href="/settings/"><i class="fas fa-gear" aria-hidden="true"></i> Settings</a>
            </div>
        </aside>
        <div id="os-agent-menu" class="os-agent-menu" role="menu" hidden></div>

        <main id="os-main" class="os-main" tabindex="-1">
            {% block content %}{% endblock %}
        </main>
    </div>

    {# Mobile primary tabs — match SPA five-tab dock; Settings stays header/gear. #}
    {% with path=request.path %}
    <nav class="os-bottom-nav d-lg-none" aria-label="Mobile primary">
        <a class="os-bottom-nav__item {% if path == '/' %}is-active{% endif %}"
           href="/" {% if path == '/' %}aria-current="page"{% endif %}>
            <span class="os-bottom-nav__label">Home</span>
        </a>
        <a class="os-bottom-nav__item {% if path == '/chat' or path|slice:':6' == '/chat/' %}is-active{% endif %}"
           href="/chat" {% if path == '/chat' or path|slice:':6' == '/chat/' %}aria-current="page"{% endif %}>
            <span class="os-bottom-nav__label">Chat</span>
        </a>
        <a class="os-bottom-nav__item {% if '/blueprint' in path or '/agent-creator' in path or '/team-creator' in path %}is-active{% endif %}"
           href="/blueprint-library/"
           {% if '/blueprint' in path or '/agent-creator' in path or '/team-creator' in path %}aria-current="page"{% endif %}>
            <span class="os-bottom-nav__label">Blueprints</span>
        </a>
        <a class="os-bottom-nav__item {% if path|slice:':7' == '/teams/' %}is-active{% endif %}"
           href="/teams/launch/"
           {% if path|slice:':7' == '/teams/' %}aria-current="page"{% endif %}>
            <span class="os-bottom-nav__label">Teams</span>
        </a>
        <a class="os-bottom-nav__item {% if path|slice:':10' == '/sessions/' %}is-active{% endif %}"
           href="/sessions/"
           {% if path|slice:':10' == '/sessions/' %}aria-current="page"{% endif %}>
            <span class="os-bottom-nav__label">Sessions</span>
        </a>
    </nav>
    {% endwith %}
    <script src="{% static 'js/agent_sidebar.js' %}"></script>
    <script src="{% static 'js/agent_pin_grid.js' %}"></script>
</body>
</html>
