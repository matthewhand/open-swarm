# fly.toml app configuration file generated for open-swarm on 2025-01-17T22:46:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'open-swarm'
primary_region = 'syd'

[build]
  # Build from local Dockerfile so LiteLLM base_url / master-key client fixes ship.
  # (Previously pinned to prebuilt mhand79/open-swarm:latest which lagged the repo.)
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'
  SWAPFILE_PATH = "/mnt/sqlite_data/swapfile" 

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1 
  processes = ['app']

# Liveness via AllowAny /health (urls.py HealthCheckView). Verified live on
# open-swarm.fly.dev (200 {"status":"ok"}); re-enabled after the 2026-06-20
# disable that avoided fly-proxy blackholing /v1 while the image lacked /health.
[[http_service.checks]]
  grace_period = "120s"
  interval = "30s"
  timeout = "15s"
  method = "GET"
  path = "/health"
  [http_service.checks.headers]
    Host = "open-swarm.fly.dev"

[deploy]
wait_timeout = "20m"    # Increase from default 5m
release_command_timeout = "10m"  # For DB migrations/pre-deploy tasks

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source="sqlite_data"
  destination="/mnt/sqlite_data"

